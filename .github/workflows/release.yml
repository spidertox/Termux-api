name: Build & Publish Signed Intelli Termux:API Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly check on Sundays

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sync with Upstream (Scheduled or on request)
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/termux/termux-api.git || true
          git fetch upstream master
          # Attempt fast-forward or merge upstream changes
          if git merge upstream/master --no-edit; then
            git push origin HEAD || echo "No changes to push or push not allowed"
          else
            echo "Merge conflict with upstream; skipping auto-sync merge"
            git merge --abort || true
          fi

      - name: Restore or Generate Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
            echo "Keystore restored from secret."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found. Generating an ephemeral keystore for this build."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias "${KEYSTORE_ALIAS:-antigem}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-123456}" -keypass "${KEY_PASSWORD:-123456}" \
              -dname "CN=Intelli, OU=Dev, O=spidertox, L=Unknown, ST=Unknown, C=US"
            echo "Ephemeral keystore generated. Set RELEASE_KEYSTORE_BASE64 to match Intelli's release signing key for sharedUserId."
          fi

      - name: Extract Version Info
        id: version
        run: |
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          TAG_NAME="v${CURRENT_VERSION_NAME}-${GITHUB_SHA:0:7}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Organize Release Artifacts
        id: artifacts
        run: |
          mkdir -p release_output
          VERSION="${{ steps.version.outputs.version_name }}"
          APK_NAME="intelli-termux-api-v${VERSION}.apk"
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "release_output/${APK_NAME}" \;
          (cd release_output && sha256sum "${APK_NAME}" > checksums-sha256.txt)
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.apk_name }}
          path: release_output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Intelli Termux:API v${{ steps.version.outputs.version_name }}
          body: |
            Custom-signed Intelli Termux:API companion APK (`com.intelli.api`, `sharedUserId="com.termux"`).

            - Version: v${{ steps.version.outputs.version_name }}
            - Built from commit: ${{ github.sha }}
            - Signed with Intelli release certificate (`intelli-termux-shared`) for shared UID access.
            - SHA256 checksum:
            ```
            ${{ hashFiles(format('release_output/{0}', steps.artifacts.outputs.apk_name)) }}
            ```
          draft: false
          prerelease: false
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

